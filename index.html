<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ascendant — a progression-fantasy solitaire roguelike</title>
<meta name="description" content="A progression-fantasy roguelike played in Spider solitaire. Clear the board to advance a rank; every rank deals one more sequence than the last." />
<link rel="stylesheet" href="src/style.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="circle" id="rank-mark" title="Rank">I</div>

    <div class="stats">
      <div class="stat"><span class="k">Rank</span><span class="v" id="stat-rank">1/6</span></div>
      <div class="stat"><span class="k">Runes</span><span class="v" id="stat-runes">0/4</span></div>
      <div class="stat"><span class="k">Moves</span><span class="v" id="stat-moves">0</span></div>
    </div>

    <div class="circle score" id="stat-score" title="Power">0</div>
  </header>

  <div class="rank-caption" id="rank-name">Ember</div>

  <div id="stock-row">
    <div class="tray" id="cells-wrap" hidden>
      <span class="tray-label">Vault</span>
      <div class="tray" id="cells"></div>
    </div>
    <span class="row-spacer"></span>
    <span class="stock-count"></span>
    <div class="stock-fan" id="stock" title="Deal one card to every column"></div>
  </div>

  <div id="core" aria-hidden="true"></div>

  <main id="board"></main>

  <div id="status"></div>

  <footer id="dock">
    <button class="dock-btn" id="btn-menu" title="Pause, rules and keys">
      <span class="icon">☰</span><span class="label">Menu</span>
    </button>
    <button class="dock-btn" id="btn-paths" title="The boons you hold">
      <span class="icon">❖</span><span class="label">Boons</span>
    </button>
    <button class="dock-btn primary" id="btn-deal" title="Deal one card to every column">
      <span class="icon deal-icon"></span><span class="label">Deal</span>
    </button>
    <button class="dock-btn" id="btn-hint" title="Cycle through the moves worth making">
      <span class="icon">✦</span><span class="label">Hint</span>
    </button>
    <button class="dock-btn" id="btn-undo" title="Take back the last move">
      <span class="icon">↺</span><span class="label">Undo <b class="count">3</b></span>
    </button>
  </footer>

  <span id="seed-tag"></span>
</div>

<div id="overlay" hidden></div>

<script type="module">
  import { boot } from './src/ui.js';
  boot();
</script>
</body>
</html>
